name: Knomira Noesis-Free Game Shell (Windows)

on:
  push:
    branches: [feature/noesis-free-shell, feature/remappable-controls, feature/controls-menu-redesign, feature/playable-engine-compile-gate, feature/playable-db-bootstrap-smoke, feature/playable-safe-data-root, feature/playable-config-startup-smoke, feature/playable-db-services-after-config, feature/fix-job-cache-task-scope, feature/playable-newgame-embark-smoke, feature/playable-db-embark-integration]
    paths:
      - "prototype/rmlui/**"
      - "content/rmlui/**"
      - "src/gui/mainwindow.*"
      - "src/gui/mainwindowrenderer.*"
      - "src/gui/noesiskeyconverter.*"
      - "src/base/global.*"
      - "src/base/pathfinder.cpp"
      - "src/base/io*.cpp"
      - "src/base/config*.cpp"
      - "src/base/db.cpp"
      - "content/db/ingnomia.db.sql"
      - "src/game/game.*"
      - "src/game/newgamesettings.*"
      - "src/game/techtree.*"
      - "src/game/gamemanager.cpp"
      - "src/game/*.h"
      - "src/gui/aggregator*.h"
      - "src/base/*.h"
      - "src/gui/aggregatorsound.*"
      - "src/gui/eventconnector.cpp"
      - "AGENTS.md"
      - "CMakeLists.txt"
      - ".github/workflows/noesis-free-shell.yml"
  pull_request:
    paths:
      - "prototype/rmlui/**"
      - ".github/workflows/noesis-free-shell.yml"
  workflow_dispatch:

jobs:
  installer-syntax-check:
    name: Validate PowerShell installer syntax
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Parse Install-Prototype.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($name in @('Install-Prototype.ps1', 'Test-GameShell.ps1')) {
            $path = Join-Path $env:GITHUB_WORKSPACE ('prototype\rmlui\' + $name)
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Host
              throw "$name has PowerShell 5.1 syntax errors."
            }
            Write-Host "$name syntax is valid."
          }

  game-shell-build:
    name: Build Noesis-free game shell
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 for MSVC 2022 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Prepare vcpkg dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP/vcpkg/vcpkg.exe" install "glfw3:x64-windows" "freetype:x64-windows"

      - name: Configure Noesis-free shell target
        shell: pwsh
        run: |
          cmake -S prototype/rmlui -B build/rmlui-prototype -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DKNOMIRA_BUILD_GAME_SHELL=ON

      - name: Build Noesis-free shell
        shell: pwsh
        run: |
          cmake --build build/rmlui-prototype --config Debug --target knomira_game_shell knomira_save_catalog_test knomira_input_bindings_test knomira_rmlui_layout_test --parallel 4

      - name: Test save discovery without Noesis
        shell: pwsh
        run: |
          & "build/rmlui-prototype/Debug/knomira_save_catalog_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "Save catalog smoke test failed." }

      - name: Test custom keyboard and gamepad bindings
        shell: pwsh
        run: |
          & "build/rmlui-prototype/Debug/knomira_input_bindings_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "Controls profile test failed." }

      # This checks the next migration boundary, without blocking working
      # shell artifacts when other engine headers still need refactoring.
      - name: Check Noesis-free engine and world header isolation
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --build build/rmlui-prototype --config Debug --target knomira_world_renderer_header_compile knomira_engine_headers_compile --parallel 4

      - name: Compile real simulation source without Noesis or legacy PCH
        shell: pwsh
        run: |
          cmake --build build/rmlui-prototype --config Debug --target knomira_simulation_source_compile knomira_engine_db_bootstrap_test knomira_engine_config_bootstrap_test knomira_io_data_root_test knomira_io_data_root_production_test knomira_engine_services_bootstrap_test knomira_newgame_settings_bootstrap_test --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Real engine source compile gate failed." }

      - name: Verify original game SQL loads into memory without writing saves
        shell: pwsh
        run: |
          & "build/rmlui-prototype/Debug/knomira_engine_db_bootstrap_test.exe" "build/rmlui-prototype/Debug/content/db/ingnomia.db.sql"
          if ($LASTEXITCODE -ne 0) { throw "Game database bootstrap smoke test failed." }

      - name: Verify isolated game data root cannot target player saves
        shell: pwsh
        run: |
          & "build/rmlui-prototype/Debug/knomira_io_data_root_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "Unsafe game data-root override detected." }
          & "build/rmlui-prototype/Debug/knomira_io_data_root_production_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "Production save path unexpectedly changed." }

      - name: Verify original Config starts safely using temporary game folders
        shell: pwsh
        run: |
          & "build/rmlui-prototype/Debug/knomira_engine_config_bootstrap_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "Original Config sandbox initialization failed." }

      - name: Initialize original DB and Strings services in isolated runtime
        shell: pwsh
        run: |
          & "build/rmlui-prototype/Debug/knomira_engine_services_bootstrap_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "Real DB/Strings service startup failed." }

      - name: Initialize real NewGameSettings and verify two-material embark roundtrip
        shell: pwsh
        run: |
          & "build/rmlui-prototype/Debug/knomira_newgame_settings_bootstrap_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "Original new-game settings or combined item roundtrip failed." }

      - name: Test actual RmlUi bindings layout geometry
        shell: pwsh
        run: |
          & "build/rmlui-prototype/Debug/knomira_rmlui_layout_test.exe" "prototype/rmlui/game_shell.rml"
          if ($LASTEXITCODE -ne 0) { throw "RmlUi controls layout collapsed or overlaps." }

      - name: Validate readable control-menu document and action IDs
        shell: pwsh
        run: |
          $file = "prototype/rmlui/game_shell.rml"
          $document = New-Object System.Xml.XmlDocument
          $document.Load((Resolve-Path $file).Path)
          $nodes = @($document.SelectNodes('//*[@id]'))
          $ids = @($nodes | ForEach-Object { $_.GetAttribute("id") })
          $required = @(
            "settings_panel", "controls_tab_menu", "controls_tab_world",
            "controls_tab_panels", "controls_tab_system",
            "controls_device_keyboard", "controls_device_xbox",
            "bindings_list", "capture_action_name", "capture_prompt",
            "capture_current", "capture_error", "capture_clear",
            "capture_cancel", "controls_reset", "controls_back"
          )
          foreach ($id in $required) {
            if ($ids -notcontains $id) { throw "Missing control-menu element: $id" }
          }
          $duplicates = $ids | Group-Object | Where-Object { $_.Count -gt 1 }
          if ($duplicates) { throw "Duplicate RML element IDs: $($duplicates.Name -join ', ')" }
          Write-Host "Controls screen XML and expected static IDs validated."

      - name: Stage Qt and FreeType runtime for desktop testing
        shell: pwsh
        run: |
          $package = "build/rmlui-prototype/Debug"
          $exe = "$package/knomira_game_shell.exe"
          if (!(Test-Path $exe)) { throw "Game shell executable missing." }
          if (!(Test-Path "$package/game_shell.rml")) { throw "Game shell document missing." }
          if (!(Test-Path "$package/content/db/ingnomia.db.sql")) { throw "Original game database not staged next to executable." }
          if (!(Test-Path "$package/content/JSON/newgame.json")) { throw "Default new-game settings missing." }
          if (!(Test-Path "$package/content/ai")) { throw "Behavior tree directory missing." }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --debug --no-translations $exe
          if ($LASTEXITCODE -ne 0) { throw "Qt runtime deployment failed." }
          $vcpkgBin = "$env:RUNNER_TEMP/vcpkg/installed/x64-windows/debug/bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -Filter "*.dll" | Copy-Item -Destination $package -Force
          }

      - name: Upload Qt prototype desktop-test files
        uses: actions/upload-artifact@v4
        with:
          name: knomira-game-shell-windows-debug
          path: |
            build/rmlui-prototype/Debug/*.exe
            build/rmlui-prototype/Debug/*.dll
            build/rmlui-prototype/Debug/game_shell.rml
            build/rmlui-prototype/Debug/content/db/**
            build/rmlui-prototype/Debug/content/ai/**
            build/rmlui-prototype/Debug/content/JSON/**
            build/rmlui-prototype/Debug/platforms/**
            build/rmlui-prototype/Debug/styles/**
            build/rmlui-prototype/Debug/generic/**
            build/rmlui-prototype/Debug/iconengines/**
            build/rmlui-prototype/Debug/tls/**
          if-no-files-found: error
