name: Agent queue coordinator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: scan or bootstrap labels
        type: choice
        required: true
        default: scan
        options: [scan, bootstrap]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: knomira-agent-queue
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name == 'schedule' || inputs.mode == 'scan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m unittest discover -s scripts -p 'test_agent_queue.py' -v
          python scripts/agent_queue.py --mode scan

  bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and bootstrap labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m unittest discover -s scripts -p 'test_agent_queue.py' -v
          python scripts/agent_queue.py --mode bootstrap
