name: Agent queue coordinator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: scan or bootstrap labels
        type: choice
        required: true
        default: scan
        options: [scan, bootstrap]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: knomira-agent-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          python -m unittest discover -s scripts -p 'test_agent_queue.py' -v
          if [ "$INPUT_MODE" = "bootstrap" ]; then
            python scripts/agent_queue.py --mode bootstrap
          else
            python scripts/agent_queue.py --mode scan
          fi
